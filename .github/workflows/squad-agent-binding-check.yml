name: Squad Agent Binding Check

on:
  workflow_run:
    # "Squad" is the installed gh-aw workflow; "Squad CI" keeps this source
    # repository's checker wired to a workflow that exists here.
    workflows: [Squad, Squad CI]
    types: [completed]

permissions:
  contents: read
  issues: read

jobs:
  check:
    name: Historical bindings (not current-run completion)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 #v6
        with:
          node-version: 22
      - name: Collect historical activation records (not run outputs)
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 #v9
        with:
          script: |
            const fs = require('node:fs');
            // Current-run completion is checked against the synchronous publication
            // response inside the trusted writer. This is only a historical audit.
            const comments = await github.paginate(github.rest.issues.listCommentsForRepo, {
              ...context.repo,
              per_page: 100,
            });
            const activationComments = comments
              .filter(comment => /Structured data:/i.test(comment.body ?? '')
                && /"squad_artifact"\s*:\s*"?(?:phases-activated|activated|phases-accepted|plan-accepted|activation-reconciled)/i.test(comment.body ?? ''))
              .map(comment => ({
                id: comment.id,
                body: comment.body,
                issue: Number(comment.issue_url.split('/').at(-1)),
              }));
            fs.writeFileSync(
              `${process.env.RUNNER_TEMP}/activation-comments.json`,
              JSON.stringify(activationComments),
            );
      - name: Audit historical bindings without asserting current-run completion
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node scripts/check-agent-binding.mjs
          --comments-file="$RUNNER_TEMP/activation-comments.json"
          --team-file=".squad/team.md"
          --repo="${{ github.repository }}"
